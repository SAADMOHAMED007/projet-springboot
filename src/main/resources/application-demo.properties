# Profil de démonstration : base H2 en mémoire, aucun serveur MySQL requis.
# Lancer avec : .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=demo
spring.datasource.url=jdbc:h2:mem:tp_foyer;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
logging.level.org.hibernate.SQL=INFO
